name: Build Stories and Deploy GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert Twee Stories to JSON
        run: |
          mkdir -p games
          if [ -d "stories" ]; then
            for story_dir in stories/*/; do
              if [ -d "$story_dir" ]; then
                folder_name=$(basename "$story_dir")
                echo "Processing story: $folder_name"
                python3 scripts/convert_twee.py "$story_dir" "games/${folder_name}.json" || true
              fi
            done
          fi

      - name: Generate Game Catalog Manifest
        run: |
          python3 -c "
          import os, json

          catalog = []
          if os.path.exists('games'):
              for f in os.listdir('games'):
                  if f.endswith('.json') and f != 'catalog.json':
                      path = os.path.join('games', f)
                      try:
                          with open(path, 'r', encoding='utf-8') as gf:
                              data = json.load(gf)
                              catalog.append({
                                  'id': f,
                                  'title': data.get('title', f),
                                  'author': data.get('author', 'Unknown')
                              })
                      except Exception as e:
                          print(f'Error reading {f}: {e}')
          
          with open('games/catalog.json', 'w', encoding='utf-8') as cat:
              json.dump(catalog, cat, indent=2)
          print('Generated games/catalog.json with', len(catalog), 'entries.')
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
